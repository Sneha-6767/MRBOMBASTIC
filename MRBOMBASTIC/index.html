<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traditional Onam Pookkalam</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <svg class="pookalam" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">

      <defs>
        <!-- A subtle grain texture so the design feels more like flowers than flat vector art -->
        <filter id="flowerTexture" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="12" result="noise"/>
          <feColorMatrix in="noise" type="saturate" values="0"/>
          <feComponentTransfer>
            <feFuncA type="table" tableValues="0 .16"/>
          </feComponentTransfer>
          <feBlend in="SourceGraphic" mode="multiply"/>
        </filter>

        <!-- One large outer petal/leaf unit, repeated eight times -->
        <g id="outerPetal">
          <path class="outerPetal"
            d="M400 122
               C365 128 326 151 304 179
               C286 202 289 225 309 239
               C330 254 358 246 378 226
               C393 211 401 188 400 165 Z"/>
          <path class="outerPink"
            d="M400 143
               C374 148 348 162 332 181
               C322 194 326 205 338 210
               C352 216 368 206 381 191
               C392 178 398 159 400 143 Z"/>
          <path class="pinkHighlight"
            d="M396 154 C378 162 359 175 344 192"/>
        </g>

        <!-- One of the eight inner yellow/red petals -->
        <g id="goldPetal">
          <path class="goldOutline"
            d="M400 394
               C377 370 357 339 355 312
               C353 286 368 268 389 269
               C409 270 424 289 422 313
               C420 340 410 370 400 394 Z"/>
          <path class="deepRed"
            d="M400 382
               C383 361 369 335 368 314
               C367 297 376 286 389 286
               C403 286 412 298 411 314
               C410 336 405 360 400 382 Z"/>
          <circle class="petalDot" cx="391" cy="308" r="3.4"/>
        </g>

        <!-- Alternating little green/white center petals -->
        <g id="greenCenterPetal">
          <ellipse class="greenPetal" cx="400" cy="350" rx="12" ry="25"/>
        </g>
        <g id="whiteCenterPetal">
          <ellipse class="whitePetal" cx="400" cy="350" rx="12" ry="25"/>
        </g>
      </defs>

      <!-- ================= OUTSIDE ================= -->

      <circle class="outerOrange" cx="400" cy="400" r="370"/>
      <circle class="orangeInner" cx="400" cy="400" r="346"/>
      <circle class="goldRing" cx="400" cy="400" r="327"/>

      <!-- Fine flower-like dots on the outer orange band -->
      <g class="outerDots">
        <circle cx="400" cy="50" r="5"/><circle cx="433" cy="52" r="4"/>
        <circle cx="465" cy="57" r="4"/><circle cx="496" cy="65" r="5"/>
        <circle cx="525" cy="77" r="4"/><circle cx="552" cy="93" r="5"/>
        <circle cx="579" cy="113" r="4"/><circle cx="604" cy="137" r="5"/>
        <circle cx="625" cy="163" r="4"/><circle cx="643" cy="191" r="5"/>
        <circle cx="657" cy="221" r="4"/><circle cx="668" cy="253" r="5"/>
        <circle cx="676" cy="286" r="4"/>
        <circle cx="400" cy="750" r="5"/><circle cx="367" cy="748" r="4"/>
        <circle cx="335" cy="743" r="4"/><circle cx="304" cy="735" r="5"/>
        <circle cx="275" cy="723" r="4"/><circle cx="248" cy="707" r="5"/>
        <circle cx="221" cy="687" r="4"/><circle cx="196" cy="663" r="5"/>
        <circle cx="175" cy="637" r="4"/><circle cx="157" cy="609" r="5"/>
        <circle cx="143" cy="579" r="4"/><circle cx="132" cy="547" r="5"/>
      </g>

      <!-- Dark green field -->
      <circle class="greenField" cx="400" cy="400" r="318"/>

      <!-- Eight organic dark-maroon outer petals -->
      <g>
        <use href="#outerPetal"/>
        <use href="#outerPetal" transform="rotate(45 400 400)"/>
        <use href="#outerPetal" transform="rotate(90 400 400)"/>
        <use href="#outerPetal" transform="rotate(135 400 400)"/>
        <use href="#outerPetal" transform="rotate(180 400 400)"/>
        <use href="#outerPetal" transform="rotate(225 400 400)"/>
        <use href="#outerPetal" transform="rotate(270 400 400)"/>
        <use href="#outerPetal" transform="rotate(315 400 400)"/>
      </g>

      <!-- ================= WHITE STAR / PURPLE STAR ================= -->

      <path class="whiteStar" d="
        M400 126 L430 169 L484 153 L475 205
        L529 219 L501 263 L553 292 L507 319
        L555 361 L505 383 L548 430 L496 440
        L518 493 L465 483 L474 540
        L425 517 L400 567 L375 517
        L326 540 L335 483 L282 493 L304 440
        L252 430 L295 383 L245 361 L293 319
        L247 292 L299 263 L271 219 L325 205
        L316 153 L370 169 Z"/>

      <path class="purpleStar" d="
        M400 145 L426 185 L478 171 L468 222
        L519 235 L491 276 L536 301 L493 326
        L537 360 L490 380 L528 421
        L480 430 L500 478 L452 469
        L460 519 L417 499 L400 543 L383 499
        L340 519 L348 469 L300 478 L320 430
        L272 421 L310 380 L263 360 L307 326
        L264 301 L309 276 L281 235 L332 222
        L322 171 L374 185 Z"/>

      <!-- purple flower grains -->
      <g class="purpleDots">
        <circle cx="400" cy="174" r="4"/><circle cx="428" cy="181" r="3"/>
        <circle cx="468" cy="196" r="4"/><circle cx="497" cy="228" r="3"/>
        <circle cx="515" cy="268" r="4"/><circle cx="526" cy="310" r="3"/>
        <circle cx="526" cy="445" r="4"/><circle cx="509" cy="485" r="3"/>
        <circle cx="476" cy="516" r="4"/><circle cx="430" cy="532" r="3"/>
        <circle cx="370" cy="532" r="3"/><circle cx="324" cy="516" r="4"/>
        <circle cx="291" cy="485" r="3"/><circle cx="274" cy="445" r="4"/>
        <circle cx="274" cy="310" r="3"/><circle cx="285" cy="268" r="4"/>
        <circle cx="303" cy="228" r="3"/><circle cx="332" cy="196" r="4"/>
      </g>

      <!-- ================= RED CENTRAL FIELD ================= -->

      <circle class="redField" cx="400" cy="400" r="184"/>

      <!-- radial red/pink seams -->
      <g class="redSeams">
        <path d="M400 216 V270"/><path d="M530 270 L490 302"/>
        <path d="M584 400 H528"/><path d="M530 530 L490 498"/>
        <path d="M400 584 V530"/><path d="M270 530 L310 498"/>
        <path d="M216 400 H272"/><path d="M270 270 L310 302"/>
      </g>

      <!-- eight large yellow outlined red petals -->
      <g filter="url(#flowerTexture)">
        <use href="#goldPetal"/>
        <use href="#goldPetal" transform="rotate(45 400 400)"/>
        <use href="#goldPetal" transform="rotate(90 400 400)"/>
        <use href="#goldPetal" transform="rotate(135 400 400)"/>
        <use href="#goldPetal" transform="rotate(180 400 400)"/>
        <use href="#goldPetal" transform="rotate(225 400 400)"/>
        <use href="#goldPetal" transform="rotate(270 400 400)"/>
        <use href="#goldPetal" transform="rotate(315 400 400)"/>
      </g>

      <!-- tiny yellow grains around the red centre -->
      <g class="yellowGrains">
        <circle cx="340" cy="251" r="4"/><circle cx="366" cy="241" r="3"/>
        <circle cx="434" cy="241" r="3"/><circle cx="460" cy="251" r="4"/>
        <circle cx="509" cy="291" r="3"/><circle cx="535" cy="335" r="4"/>
        <circle cx="535" cy="465" r="4"/><circle cx="509" cy="509" r="3"/>
        <circle cx="460" cy="549" r="4"/><circle cx="434" cy="559" r="3"/>
        <circle cx="366" cy="559" r="3"/><circle cx="340" cy="549" r="4"/>
        <circle cx="291" cy="509" r="3"/><circle cx="265" cy="465" r="4"/>
        <circle cx="265" cy="335" r="4"/><circle cx="291" cy="291" r="3"/>
      </g>

      <!-- ================= CENTRE FLOWER ================= -->

      <circle class="centerRedRing" cx="400" cy="400" r="70"/>
      <circle class="centerGreenRing" cx="400" cy="400" r="55"/>

      <!-- alternating 12 petals -->
      <g>
        <use href="#greenCenterPetal" transform="rotate(0 400 400)"/>
        <use href="#whiteCenterPetal" transform="rotate(30 400 400)"/>
        <use href="#greenCenterPetal" transform="rotate(60 400 400)"/>
        <use href="#whiteCenterPetal" transform="rotate(90 400 400)"/>
        <use href="#greenCenterPetal" transform="rotate(120 400 400)"/>
        <use href="#whiteCenterPetal" transform="rotate(150 400 400)"/>
        <use href="#greenCenterPetal" transform="rotate(180 400 400)"/>
        <use href="#whiteCenterPetal" transform="rotate(210 400 400)"/>
        <use href="#greenCenterPetal" transform="rotate(240 400 400)"/>
        <use href="#whiteCenterPetal" transform="rotate(270 400 400)"/>
        <use href="#greenCenterPetal" transform="rotate(300 400 400)"/>
        <use href="#whiteCenterPetal" transform="rotate(330 400 400)"/>
      </g>

      <!-- central pale flower -->
      <circle class="centerWhite" cx="400" cy="400" r="27"/>
      <circle class="centerPink" cx="400" cy="400" r="19"/>
      <circle class="centerGold" cx="400" cy="400" r="5"/>

      <!-- a few tiny centre specks -->
      <g class="centerSpecks">
        <circle cx="400" cy="386" r="2"/>
        <circle cx="413" cy="393" r="2"/>
        <circle cx="414" cy="408" r="2"/>
        <circle cx="400" cy="415" r="2"/>
        <circle cx="386" cy="408" r="2"/>
        <circle cx="386" cy="393" r="2"/>
      </g>

    </svg>
  </main>
</body>
</html>
